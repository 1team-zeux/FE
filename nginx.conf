include /etc/nginx/mime.types;
types {
    application/javascript mjs;
}

server {
    listen 80;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # auth-server
    location /auth/ {
        proxy_pass ${AUTH_SERVER_URL}/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # sla-agent-service
    location /api/v1/ {
        proxy_pass ${SLA_AGENT_URL}/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /tenants {
        proxy_pass ${SLA_AGENT_URL}/tenants;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # sla-agent-service — FinOps Agent (SSE: /api/finops/run/stream)
    location /api/finops/ {
        proxy_pass ${SLA_AGENT_URL}/api/finops/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # sla-agent-service — RCA read API
    location /api/rca/ {
        proxy_pass ${SLA_AGENT_URL}/api/rca/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # monitoring-api (prefix strip: /monitoring/ → /)
    location /monitoring/ {
        proxy_pass ${MONITORING_API_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # api-gateway
    location /terraform/ {
        proxy_pass ${API_GATEWAY_URL}/terraform/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /sla-bundles {
        proxy_pass ${API_GATEWAY_URL}/sla-bundles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sla-bundles/ {
        proxy_pass ${API_GATEWAY_URL}/sla-bundles/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /topologies/ {
        proxy_pass ${API_GATEWAY_URL}/topologies/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /upload-sessions {
        proxy_pass ${API_GATEWAY_URL}/upload-sessions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /upload-sessions/ {
        proxy_pass ${API_GATEWAY_URL}/upload-sessions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
